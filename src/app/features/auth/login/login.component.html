<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
      Controle Financeiro
    </h2>
    <p class="mt-2 text-center text-sm text-gray-600">
      Acesse sua conta
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10 border border-gray-200">
      <form class="space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <!-- Campo E-mail -->
        <div>
          <label for="login" class="block text-sm font-medium text-gray-700">
            Login
          </label>
          <div class="mt-1">
            <input id="login" type="text" formControlName="login" autocomplete="login"
              class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
          </div>
        </div>

        <!-- Campo Senha -->
        <div>
          <label for="senha" class="block text-sm font-medium text-gray-700">
            Senha
          </label>
          <div class="mt-1">
            <input id="senha" type="password" formControlName="senha"
              class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
          </div>
        </div>

        <!-- Botão Submit -->
        <div>

          <button type="submit" [disabled]="loginForm.invalid || isLoading"
            class="w-full flex items-center justify-center gap-2 py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">

            <!-- SVG Spinner nativo do Tailwind -->
            <svg *ngIf="isLoading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg"
              fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
              </path>
            </svg>

            <!-- Lógica de Texto -->
            <span *ngIf="!isLoading">Entrar</span>
            <span *ngIf="isLoading">Aguarde...</span>
          
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
