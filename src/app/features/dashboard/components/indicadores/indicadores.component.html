<div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-5">
  
  <!-- Card: Total Gasto -->
  <div class="bg-white rounded-lg shadow p-6 border-l-4 border-blue-500">
    <div class="flex items-center justify-between">
      <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider">Total Gasto</h3>
      <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
    </div>
    <p class="mt-2 text-3xl font-bold text-gray-900">{{ totalGasto | currency:'BRL' }}</p>
  </div>

  <!-- Card: Maior Despesa -->
  <div class="bg-white rounded-lg shadow p-6 border-l-4 border-red-500">
    <div class="flex items-center justify-between">
      <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider">Maior Despesa</h3>
      <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"></path>
      </svg>
    </div>
    <p class="mt-2 text-3xl font-bold text-gray-900">{{ maiorDespesa | currency:'BRL' }}</p>
  </div>

  <!-- Card: Lançamentos -->
  <div class="bg-white rounded-lg shadow p-6 border-l-4 border-green-500">
    <div class="flex items-center justify-between">
      <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider">Lançamentos</h3>
      <svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
      </svg>
    </div>
    <p class="mt-2 text-3xl font-bold text-gray-900">{{ quantidadeLancamentos }}</p>
  </div>

</div>
