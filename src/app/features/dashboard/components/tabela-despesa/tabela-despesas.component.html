<div class="bg-white rounded-lg shadow overflow-hidden">
  @if (carregando) {
    <!-- Spinner de Loading -->
    <div class="flex justify-center items-center p-12">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
      <span class="ml-4 text-gray-600 font-medium">Carregando despesas...</span>
    </div>
  } @else {
    <!-- Tabela Renderizada -->
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Descrição</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Categoria</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Data</th>
          <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Valor</th>
          <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        @for (despesa of despesas; track despesa.id) {
          <tr>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ despesa.descricao }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ despesa.categoria }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ despesa.data }}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-right text-gray-900">
              {{ despesa.valor | currency:'BRL' }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-center space-x-4">
              <button (click)="editar(despesa)" class="text-blue-500 hover:text-blue-700 font-semibold transition-colors">
                Editar
              </button>
              <button (click)="excluir(despesa.id)" class="text-red-500 hover:text-red-700 font-semibold transition-colors">
                Excluir
              </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="px-6 py-4 text-center text-sm text-gray-500">Nenhuma despesa registrada.</td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
