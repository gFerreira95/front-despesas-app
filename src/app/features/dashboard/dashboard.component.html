<div class="min-h-screen bg-gray-100 p-8">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Cabeçalho -->
    <div class="bg-white rounded-lg shadow p-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-gray-900">Controle de Despesas</h1>
      <button (click)="logout()" class="text-sm font-medium text-red-600 hover:text-red-800 transition-colors">
        Sair do Sistema
      </button>
    </div>

    <!-- Secção de Indicadores com Botão de Filtro -->
    <div class="space-y-2">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-lg font-semibold text-gray-700">Resumo Financeiro</h2>
        <button (click)="abrirFiltro('indicadores')" class="flex items-center space-x-1 text-sm text-blue-600 hover:text-blue-800">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
          <span>Filtrar Indicadores</span>
        </button>
      </div>
      <app-indicadores [despesas]="despesasIndicadores"></app-indicadores>
    </div>

    <!-- Formulário -->
    <app-formulario-despesa 
      [despesaEmEdicao]="despesaSelecionada"
      [carregando]="carregando"
      (aoSalvar)="salvarDespesa($event)"
      (aoCancelar)="cancelarEdicao()">
    </app-formulario-despesa>

    <!-- Secção da Tabela com Botão de Filtro -->
    <div class="space-y-2">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-lg font-semibold text-gray-700">Lançamentos</h2>
        <button (click)="abrirFiltro('tabela')" class="flex items-center space-x-1 text-sm text-blue-600 hover:text-blue-800">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
          <span>Filtrar Tabela</span>
        </button>
      </div>
      <app-tabela-despesas 
        [despesas]="despesasTabela" 
        [carregando]="carregando" 
        (aoExcluir)="excluirDespesa($event)"
        (aoEditar)="prepararEdicao($event)">
      </app-tabela-despesas>
    </div>

    <!-- Componente Modal de Filtro -->
    <app-filtro-despesas 
      [visivel]="modalFiltroVisivel" 
      [contexto]="contextoFiltroAtual"
      (aoAplicar)="processarFiltro($event)"
      (aoFechar)="modalFiltroVisivel = false">
    </app-filtro-despesas>

  </div>
</div>
