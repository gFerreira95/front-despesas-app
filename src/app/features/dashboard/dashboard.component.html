<div class="min-h-screen bg-gray-100 p-8">
  <div class="max-w-7xl mx-auto space-y-6">

    <!-- Cabeçalho Principal -->
    <div class="bg-white rounded-lg shadow p-6 flex flex-col md:flex-row justify-between items-center gap-4">

      <!-- Lado Esquerdo: Título -->
      <h1 class="text-2xl font-bold text-gray-900 w-full md:w-auto text-center md:text-left">
        Controle de Despesas
      </h1>

      <!-- Centro: Navegador de Mês/Ano -->
      <div class="flex items-center bg-gray-50 rounded-lg shadow-sm border border-gray-200 p-1 mx-auto">
        <button (click)="mesAnterior()" class="p-2 hover:bg-white hover:shadow-sm rounded text-gray-600 transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
          </svg>
        </button>

        <div class="w-40 text-center font-semibold text-gray-800 capitalize select-none">
          {{ nomeMesAtual }} {{ anoAtual }}
        </div>

        <button (click)="proximoMes()" class="p-2 hover:bg-white hover:shadow-sm rounded text-gray-600 transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
          </svg>
        </button>
      </div>

      <!-- Lado Direito: Perfil e Logout -->
      <div class="flex items-center gap-6 w-full md:w-auto justify-center md:justify-end">
        <a routerLink="/perfil"
          class="flex items-center gap-3 bg-white p-2 rounded-lg border border-transparent hover:border-gray-200 hover:bg-gray-50 transition-colors cursor-pointer text-decoration-none">

          <img [src]="fotoPerfil || 'https://ui-avatars.com/api/?name=User&background=0D8ABC&color=fff'"
            alt="Ir para Perfil" class="w-10 h-10 rounded-full object-cover border border-gray-300">
          <span class="font-medium text-gray-700 hidden sm:block">Meu Perfil</span>
        </a>

        <button (click)="logout()"
          class="text-sm font-medium text-red-600 hover:text-red-800 transition-colors font-semibold">
          Sair do Sistema
        </button>
      </div>

    </div>

    <!-- Secção de Indicadores com Botão de Filtro -->
    <div class="space-y-2">
      <a routerLink="/metricas"
        class="flex items-center space-x-1 text-sm text-green-600 hover:text-green-800 ml-4 font-semibold">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path>
        </svg>
        <span>Métricas</span>
      </a>
      <app-indicadores [despesas]="despesasIndicadores" [carregando]="carregando"></app-indicadores>
    </div>


    <!-- Formulário -->
    <app-formulario-despesa [despesaEmEdicao]="despesaSelecionada" [isLoading]="isLoading"
      (aoSalvar)="salvarDespesa($event)" (aoCancelar)="cancelarEdicao()">
    </app-formulario-despesa>

    <!-- Secção da Tabela com Botão de Filtro -->
    <div class="space-y-2">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-lg font-semibold text-gray-700">Lançamentos</h2>
        <button (click)="abrirFiltro('tabela')"
          class="flex items-center space-x-1 text-sm text-blue-600 hover:text-blue-800">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z">
            </path>
          </svg>
          <span>Filtrar Tabela</span>
        </button>
      </div>
      <app-tabela-despesas [despesas]="despesasTabela" [carregando]="carregando" (aoExcluir)="excluirDespesa($event)"
        (aoEditar)="prepararEdicao($event)">
      </app-tabela-despesas>
    </div>

    <!-- Componente Modal de Filtro -->
    <app-filtro-despesas [visivel]="modalFiltroVisivel" [contexto]="contextoFiltroAtual"
      (aoAplicar)="processarFiltro($event)" (aoFechar)="modalFiltroVisivel = false">
    </app-filtro-despesas>

  </div>
</div>
